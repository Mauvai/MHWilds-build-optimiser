# Monster Hunter Wilds -- High Rank armour before Armor Transcending
# Source: the Wilds API, https://wilds.mhdb.io (data version 2026-04-15),
# /en/armor with rank "high". high_rank_armor.yaml lists transcended slots
# and transcended maximum defence for every piece that can be transcended
# (its 'slots_source: transcended' pieces, rarity 5 and 6); this file holds
# what those same pieces have without it, which is what the API reports.
# One record per transcended piece, by name, in the High Rank file's order.
