# Monster Hunter Wilds -- Low Rank Armor Pieces
# Source: the Wilds API, https://wilds.mhdb.io (data version 2026-04-15),
# every piece of /en/armor/sets whose rank is "low". Unlike the High Rank
# file this was not compiled from game8: it is the API's own record, so
# 'source_url' points at the piece's API entry. Same schema as
# high_rank_armor.yaml, plus 'rank: low'. Low Rank armour cannot be
# transcended, so 'slots' and 'defense' are the piece's only values and
# 'slots_source' is always 'base'. Set and group bonuses use the same names
# and tiers as the High Rank file; every one of them also appears there.
